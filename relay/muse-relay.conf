# Muse Gadget relay (2026-10-23): ESP32-C3 behind GFW -> Muse cloud via tx-sg. Does not touch VPN/xray.
server {
    listen 10443 ssl;
    server_name xjp.112583.xyz;

    ssl_certificate /root/workspace/data/ssl/xjp.crt;
    ssl_certificate_key /root/workspace/data/ssl/xjp.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/muse-relay.access.log;
    error_log /var/log/nginx/muse-relay.error.log;

    location = /v1/noise {
        proxy_pass https://hatch.metaaivm.com;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host hatch.metaaivm.com;
        proxy_ssl_server_name on;
        proxy_ssl_name hatch.metaaivm.com;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location /gadget-img/ {
        alias /var/www/muse-img/;
        access_log off;
    }

    location / {
        proxy_pass https://api.muse.ai;
        proxy_http_version 1.1;
        proxy_set_header Host api.muse.ai;
        proxy_ssl_server_name on;
        proxy_ssl_name api.muse.ai;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# Plain-HTTP image host for the gadget (its RAM cannot afford HTTPS image downloads).
server {
    listen 80;
    server_name 43.156.127.43;

    location /gadget-img/ {
        alias /var/www/muse-img/;
        access_log off;
    }

    location / {
        return 404;
    }
}
